<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username"
               type="text"
               [(ngModel)]="username"
               name="username"
               placeholder="Enter username"
               required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password"
               type="password"
               [(ngModel)]="password"
               name="password"
               placeholder="Enter password"
               required />
      </div>

      <button type="submit">Login</button>
    </form>

    <div *ngIf="loginSuccess === true" class="message success">
      {{ message }}
    </div>
    <div *ngIf="loginSuccess === false" class="message error">
      {{ message }}
    </div>
  </div>
</div>
